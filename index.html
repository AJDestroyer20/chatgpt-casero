<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Pro Max</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function ChatBot() {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: '¡Hola! 👋 Soy tu asistente inteligente. Puedo ayudarte con:\n\n• Programación y código\n• Análisis de datos\n• Resolución de problemas\n• Y mucho más...\n\n¿En qué puedo ayudarte?' }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, isTyping]);

            const generateResponse = (userMessage) => {
                const lower = userMessage.toLowerCase();
                
                if (lower.includes('hola') || lower.includes('hello')) {
                    return '¡Hola! 👋 ¿En qué puedo ayudarte hoy?';
                }
                
                if (lower.includes('código') || lower.includes('programar')) {
                    return 'Puedo ayudarte con código en JavaScript, Python, Java y más. ¿Qué necesitas crear?';
                }
                
                return `Interesante pregunta sobre "${userMessage}". ¿Podrías darme más detalles para ayudarte mejor?`;
            };

            const handleSubmit = () => {
                if (!input.trim() || isTyping) return;

                const userMessage = input.trim();
                setMessages(prev => [...prev, { role: 'user', content: userMessage }]);
                setInput('');
                
                setIsTyping(true);
                setTimeout(() => {
                    const response = generateResponse(userMessage);
                    setMessages(prev => [...prev, { role: 'assistant', content: response }]);
                    setIsTyping(false);
                }, 1000);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            };

            return (
                <div className="flex flex-col h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
                    {/* Header */}
                    <div className="bg-black/30 backdrop-blur-lg border-b border-purple-500/20 p-4">
                        <div className="max-w-4xl mx-auto">
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                                AI Chat Pro Max
                            </h1>
                        </div>
                    </div>

                    {/* Messages */}
                    <div className="flex-1 overflow-y-auto p-4">
                        <div className="max-w-4xl mx-auto space-y-4">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex gap-3 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {msg.role === 'assistant' && (
                                        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center flex-shrink-0">
                                            <span className="text-white text-xs">AI</span>
                                        </div>
                                    )}
                                    <div className={`max-w-2xl px-6 py-4 rounded-2xl ${
                                        msg.role === 'user' 
                                            ? 'bg-gradient-to-br from-blue-600 to-blue-700 text-white'
                                            : 'bg-white/10 backdrop-blur-xl text-white border border-white/10'
                                    }`}>
                                        <div className="whitespace-pre-wrap">{msg.content}</div>
                                    </div>
                                </div>
                            ))}
                            
                            {isTyping && (
                                <div className="flex gap-3">
                                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center">
                                        <span className="text-white text-xs">AI</span>
                                    </div>
                                    <div className="px-6 py-4 rounded-2xl bg-white/10 backdrop-blur-xl border border-white/10">
                                        <div className="flex gap-2">
                                            <div className="w-2 h-2 rounded-full bg-purple-400 animate-bounce"></div>
                                            <div className="w-2 h-2 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                            <div className="w-2 h-2 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '0.4s'}}></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            <div ref={messagesEndRef} />
                        </div>
                    </div>

                    {/* Input */}
                    <div className="bg-black/30 backdrop-blur-lg border-t border-purple-500/20 p-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex gap-3 bg-white/5 rounded-2xl p-2 border border-white/10">
                                <textarea
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={handleKeyPress}
                                    placeholder="Escribe tu mensaje..."
                                    className="flex-1 bg-transparent text-white placeholder-purple-300/50 px-4 py-3 focus:outline-none resize-none"
                                    rows="1"
                                    disabled={isTyping}
                                />
                                <button
                                    onClick={handleSubmit}
                                    disabled={isTyping || !input.trim()}
                                    className="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 disabled:opacity-50 text-white font-semibold"
                                >
                                    Enviar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ChatBot />, document.getElementById('root'));
    </script>
</body>
</html>
